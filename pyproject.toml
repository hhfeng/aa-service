[project]
name = "aa-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "graphifyy",
    "uvicorn>=0.27.0",
]

[tool.uv.sources]
graphifyy = { git = "https://github.com/hhfeng/aa-graphify" }

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyinstaller>=6.20.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
