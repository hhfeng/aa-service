name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: aa-service
            asset_name: aa-service-linux.tar.gz
          - os: windows-latest
            artifact_name: aa-service.exe
            asset_name: aa-service-windows.zip
          - os: macos-latest
            artifact_name: aa-service
            asset_name: aa-service-macos.zip

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Build with PyInstaller
        run: |
          uv run pyinstaller aa-service.spec

      - name: Prepare release folder (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir release
          cp dist/aa-service release/
          cp kbs.json release/
          cp README.md release/

      - name: Prepare release folder (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir release
          copy dist\aa-service.exe release\
          copy kbs.json release\
          copy README.md release\

      - name: Create Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -czvf aa-service-linux.tar.gz -C release .

      - name: Create Archive (macOS)
        if: runner.os == 'macOS'
        run: zip -r aa-service-macos.zip release/*

      - name: Create Archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path release\* -DestinationPath aa-service-windows.zip

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
